<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<!--
  Virus lecture-page skeleton.
  Fill every <!-- FILL: ... --> placeholder; keep the CSS and class structure as-is.
  See references/lecture-page-generation.md for what goes in each part.
-->
<title><!-- FILL: lecture title --></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f7f5f0;
  --surface:#ffffff;
  --surface-2:#eeeae1;
  --border:#ddd7c9;
  --text:#232019;
  --text-dim:#6b6455;
  --accent:#b6541c;
  --accent-soft:#f0e1d3;
  --accent-strong:#8c3f13;
  --code-bg:#232019;
  --code-text:#f3ead9;
  --good:#3f6b3a;
  --font-display:'Manrope',system-ui,sans-serif;
  --font-body:'Manrope',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1812;
    --surface:#252119;
    --surface-2:#2e291f;
    --border:#3d3728;
    --text:#f1ece1;
    --text-dim:#a89e88;
    --accent:#e08b4f;
    --accent-soft:#3a2a1c;
    --accent-strong:#f0a870;
    --code-bg:#12100b;
    --code-text:#f3ead9;
    --good:#7fb478;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1812;
  --surface:#252119;
  --surface-2:#2e291f;
  --border:#3d3728;
  --text:#f1ece1;
  --text-dim:#a89e88;
  --accent:#e08b4f;
  --accent-soft:#3a2a1c;
  --accent-strong:#f0a870;
  --code-bg:#12100b;
  --code-text:#f3ead9;
  --good:#7fb478;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.6;
}
.wrap{
  max-width:920px;
  margin:0 auto;
  padding:56px 24px 120px;
}
header.hero{
  padding:0 0 36px;
  border-bottom:2px solid var(--border);
  margin-bottom:40px;
}
.eyebrow{
  font-family:var(--font-mono);
  font-size:.78rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--accent-strong);
  font-weight:600;
}
h1{
  font-family:var(--font-display);
  font-size:clamp(2.1rem,5vw,3.1rem);
  font-weight:800;
  letter-spacing:-0.01em;
  margin:.4em 0 .3em;
  text-wrap:balance;
}
.dek{
  color:var(--text-dim);
  font-size:1.08rem;
  max-width:640px;
  text-wrap:pretty;
}
nav.toc{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:24px;
}
nav.toc a{
  font-family:var(--font-mono);
  font-size:.78rem;
  color:var(--text-dim);
  text-decoration:none;
  padding:5px 10px;
  border:1px solid var(--border);
  border-radius:5px;
  background:var(--surface);
}
nav.toc a:hover, nav.toc a:focus-visible{
  border-color:var(--accent);
  color:var(--accent-strong);
  outline:none;
}
section{
  margin-bottom:52px;
}
.section-num{
  font-family:var(--font-mono);
  color:var(--accent);
  font-weight:600;
  font-size:.85rem;
}
h2{
  font-family:var(--font-display);
  font-size:1.5rem;
  font-weight:700;
  margin:.15em 0 .5em;
  text-wrap:balance;
}
h3{
  font-family:var(--font-display);
  font-size:1.05rem;
  font-weight:700;
  margin:1.4em 0 .5em;
}
p{ max-width:70ch; }
p.lead{ color:var(--text-dim); }
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:20px 22px;
  margin:16px 0;
}
.card.tip{
  border-left:3px solid var(--good);
}
.card.tip .label, .card.warn .label{
  font-family:var(--font-mono);
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:600;
  color:var(--good);
  display:block;
  margin-bottom:6px;
}
.card.warn{
  border-left:3px solid var(--accent);
}
.card.warn .label{ color:var(--accent-strong); }
pre{
  background:var(--code-bg);
  color:var(--code-text);
  padding:16px 18px;
  border-radius:8px;
  overflow-x:auto;
  font-family:var(--font-mono);
  font-size:.86rem;
  line-height:1.55;
  margin:14px 0;
}
code{
  font-family:var(--font-mono);
  font-size:.86em;
  background:var(--surface-2);
  padding:.15em .4em;
  border-radius:4px;
}
pre code{ background:none; padding:0; }
.comment{ color:var(--text-dim); }
ol,ul{ padding-left:1.3em; max-width:68ch; }
li{ margin-bottom:.35em; }
table{
  width:100%;
  border-collapse:collapse;
  margin:16px 0;
  font-size:.92rem;
}
th,td{
  text-align:left;
  padding:8px 12px;
  border-bottom:1px solid var(--border);
}
th{
  font-family:var(--font-mono);
  font-size:.75rem;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--text-dim);
}
td code{ font-size:.82em; }
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
@media (max-width:640px){ .grid2{ grid-template-columns:1fr; } }
.stage{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  font-family:var(--font-mono);
  font-size:.85rem;
  margin:18px 0;
}
.stage span{
  background:var(--surface-2);
  border:1px solid var(--border);
  padding:6px 12px;
  border-radius:6px;
}
.stage .arrow{ color:var(--text-dim); background:none; border:none; padding:0; }
footer{
  border-top:2px solid var(--border);
  margin-top:60px;
  padding-top:24px;
  color:var(--text-dim);
  font-size:.9rem;
}
a{ color:var(--accent-strong); }
::selection{ background:var(--accent-soft); }
</style>

<div class="wrap">

<header class="hero">
  <!-- FILL: a short kicker line, e.g. "<topic> — lecture 3 of 9" -->
  <div class="eyebrow"><!-- FILL: eyebrow text --></div>
  <!-- FILL: lecture title, same as <title> above -->
  <h1><!-- FILL: lecture title --></h1>

  <p class="dek"><!-- FILL: one-line dek --></p>
  <!-- FILL: one <a href="#id"> per numbered section below, same ids -->
  <nav class="toc">
    <!-- <a href="#section-id">N. Section title</a> -->
  </nav>
</header>

<section id="<!-- FILL: section id -->">
  <div class="section-num"><!-- FILL: 01, 02, ... --></div>
  <h2><!-- FILL: section heading --></h2>
  <p class="lead"><!-- FILL: lead paragraph for this section --></p>

  <!--
    Optional: a stage-flow diagram — use only when this lecture's core idea is a

  -->
  <div class="stage">
    <span><!-- FILL: stage 1 --></span><span class="arrow">→</span><span><!-- FILL: stage 2 --></span>
  </div>

  <h3><!-- FILL: subsection heading, optional --></h3>
  <p><!-- FILL: explanatory prose, in voice --></p>
  <pre><code><!-- FILL: real, runnable code --></code></pre>

  <!-- Optional: a tip card for a genuinely good practice -->
  <div class="card tip">
    <span class="label"><!-- FILL: short label --></span>
    <!-- FILL: the tip, in voice -->
  </div>

  <!-- Optional: a warn card for a real gotcha / common mistake -->
  <div class="card warn">
    <span class="label"><!-- FILL: short label --></span>
    <!-- FILL: the warning, in voice -->
  </div>
</section>

<!-- Add further <section> blocks here, one per beat, incrementing section-num -->

<footer>
  <!-- FILL: a short close naming what's next in the roadmap (not a generic sign-off) -->
</footer>

</div>

</body></html>
