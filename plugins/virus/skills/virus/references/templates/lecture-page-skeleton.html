*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.6;
}
.wrap{
  max-width:920px;
  margin:0 auto;
  padding:40px 24px 120px;
}
header.hero{
  display:flex;
  align-items:center;
  gap:24px;
  padding:0 0 28px;
  border-bottom:2px solid var(--border);
  margin-bottom:40px;
  flex-wrap:wrap;
}
.mascot{
  width:120px;
  height:120px;
  flex:none;
  background-image:var(--mascot-img-data);
  background-size:cover;
  background-position:center;
  border-radius:50%;
  border:3px solid var(--accent);
  box-shadow:0 0 0 4px var(--bg), 0 0 0 5px var(--border);
}
.hero-text{ flex:1; min-width:260px; }
.eyebrow{
  font-family:var(--font-mono);
  font-size:.78rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:600;
}
h1{
  font-family:var(--font-display);
  font-size:clamp(1.8rem,4.5vw,2.6rem);
  font-weight:800;
  letter-spacing:-0.01em;
  margin:.3em 0 .25em;
  text-wrap:balance;
  color:#ffffff;
}
.dek{
  color:var(--text-dim);
  font-size:1.02rem;
  max-width:640px;
  text-wrap:pretty;
}
nav.toc{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}
nav.toc a{
  font-family:var(--font-mono);
  font-size:.78rem;
  color:var(--text-dim);
  text-decoration:none;
  padding:5px 10px;
  border:1px solid var(--border);
  border-radius:5px;
  background:var(--surface);
}
nav.toc a:hover, nav.toc a:focus-visible{
  border-color:var(--accent);
  color:var(--accent-strong);
  outline:none;
}
section{
  margin-bottom:52px;
}
.section-num{
  font-family:var(--font-mono);
  color:var(--accent);
  font-weight:600;
  font-size:.85rem;
}
h2{
  font-family:var(--font-display);
  font-size:1.4rem;
  font-weight:700;
  margin:.15em 0 .5em;
  text-wrap:balance;
  color:#ffffff;
}
h3{
  font-family:var(--font-display);
  font-size:1.02rem;
  font-weight:700;
  margin:1.4em 0 .5em;
  color:#ffffff;
}
p{ max-width:70ch; }
p.lead{ color:var(--text-dim); }
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:18px 20px;
  margin:16px 0;
  position:relative;
}
.card.tip{
  border-left:3px solid var(--good);
}
.card.tip .label, .card.warn .label{
  font-family:var(--font-mono);
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:600;
  color:var(--good);
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
}
.card.warn{
  border-left:3px solid var(--accent);
}
.card.warn .label{ color:var(--accent-strong); }
.mascot-badge{
  width:22px;
  height:22px;
  border-radius:50%;
  background-image:var(--mascot-img-data);
  background-size:cover;
  background-position:center;
  flex:none;
  border:1px solid var(--border);
}
pre{
  background:var(--code-bg);
  color:var(--code-text);
  padding:16px 18px;
  border-radius:8px;
  overflow-x:auto;
  font-family:var(--font-mono);
  font-size:.86rem;
  line-height:1.55;
  margin:14px 0;
  border:1px solid var(--border);
}
code{
  font-family:var(--font-mono);
  font-size:.86em;
  background:var(--surface-2);
  padding:.15em .4em;
  border-radius:4px;
}
pre code{ background:none; padding:0; }
.comment{ color:var(--text-dim); }
ol,ul{ padding-left:1.3em; max-width:68ch; }
li{ margin-bottom:.35em; }
table{
  width:100%;
  border-collapse:collapse;
  margin:16px 0;
  font-size:.92rem;
}
th,td{
  text-align:left;
  padding:8px 12px;
  border-bottom:1px solid var(--border);
}
th{
  font-family:var(--font-mono);
  font-size:.75rem;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--text-dim);
}
td code{ font-size:.82em; }
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
@media (max-width:640px){ .grid2{ grid-template-columns:1fr; } header.hero{ flex-direction:column; align-items:flex-start; } }
.stage{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  font-family:var(--font-mono);
  font-size:.85rem;
  margin:18px 0;
}
.stage span{
  background:var(--surface-2);
  border:1px solid var(--border);
  padding:6px 12px;
  border-radius:6px;
}
.stage .arrow{ color:var(--text-dim); background:none; border:none; padding:0; }
footer{
  display:flex;
  align-items:center;
  gap:16px;
  border-top:2px solid var(--border);
  margin-top:60px;
  padding-top:24px;
  color:var(--text-dim);
  font-size:.9rem;
}
footer .mascot-badge{ width:36px; height:36px; }
a{ color:var(--accent-strong); }
::selection{ background:var(--accent-soft); }
</style>
