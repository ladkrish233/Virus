*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--body);overflow-x:hidden}
.app{height:100vh;min-height:620px;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:2px solid var(--line)}
header h1{font:28px/1 var(--display);margin:0;color:var(--orange);letter-spacing:.5px}
header .sub{font-size:14px;color:var(--dim)}
.tag{font-size:12px;background:var(--purple);color:#fff;border-radius:999px;padding:3px 10px;font-weight:600}
.main{display:grid;grid-template-columns:minmax(230px,24%) minmax(0,1fr) minmax(230px,24%);min-height:0}
/* teacher column */
.teacher{position:relative;border-right:2px solid var(--line);display:flex;flex-direction:column;justify-content:flex-start;padding:16px;min-height:0;overflow:auto;background:radial-gradient(circle at 30% 80%,#2a1b3d 0,transparent 60%)}
.teacher .figure{width:100%;max-width:420px;aspect-ratio:700/638;background-image:var(--teacher);background-size:contain;background-repeat:no-repeat;background-position:left bottom;align-self:flex-start;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.speech{background:#fff;color:var(--ink);border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.5;position:relative;margin:auto 0 14px}
.speech:after{content:"";position:absolute;bottom:-12px;left:34px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
.speech b{color:var(--purple)}
.tracker{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:12px}
.tracker div{font-size:12px;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:10px;background:#1f1f28;color:var(--dim);border:1px solid #2d2d38;transition:all .35s}
.tracker div.now{background:var(--orange);color:#111;border-color:var(--orange);font-weight:700}
.tracker div.past{color:var(--lime)}
.tracker div.past:before{content:"✓ "}
/* board */
.board-wrap{display:flex;flex-direction:column;min-width:0;min-height:0;padding:16px;gap:12px}
.board{flex:1;min-height:0;position:relative;border-radius:18px;background:#1b1b22;border:2px solid var(--line);overflow:hidden;background-image:radial-gradient(#2a2a35 1px,transparent 1px);background-size:22px 22px}
.stage{position:absolute;inset:0;padding:22px 22px 70px;overflow:auto;display:flex;flex-direction:column}
.takeaway{position:absolute;left:0;right:0;bottom:0;background:var(--hot);color:#111;font:700 15px var(--body);padding:12px 22px;display:flex;gap:10px;align-items:center}
.takeaway b{font:24px var(--display);letter-spacing:.5px}
.stage-title{font:26px/1.1 var(--display);color:var(--blue);margin:0 0 10px}
.stage-note{color:var(--dim);font-size:14px;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:600 14px var(--body);color:var(--ink);background:var(--blue);border:0;border-radius:999px;padding:8px 14px;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:#2c2c38;color:var(--text)}
.btn.on{background:var(--orange);color:#111}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i,0)*140ms)}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(10px)}to{opacity:1;transform:none}}
.slide{animation:slide .6s ease both;animation-delay:calc(var(--i,0)*160ms)}
@keyframes slide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.fade{animation:fade .6s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* PDF paper */
.paper{background:var(--paper);color:var(--ink);width:min(560px,100%);border-radius:6px;padding:26px 30px 22px;box-shadow:0 14px 30px rgba(0,0,0,.45);transform:rotate(-1.2deg);position:relative;animation:paperIn .7s cubic-bezier(.2,1,.3,1) both}
@keyframes paperIn{from{opacity:0;transform:translateY(40px) rotate(-6deg)}to{opacity:1;transform:rotate(-1.2deg)}}
.paper h4{font:600 18px var(--body);margin:0 0 8px;border-bottom:2px solid #ddd;padding-bottom:6px}
.paper p{margin:0 0 10px;font-size:14.5px;line-height:1.6;border-radius:4px;transition:background .25s;padding:2px 4px}
.paper p:hover{background:#ffe9a8;cursor:help}
.paper .foot{font-size:12px;color:#777;text-align:right;margin-top:6px}
.raw{font:13px/1.5 ui-monospace,Consolas,monospace;background:#0b0b0f;color:#9ff0c0;border-radius:10px;padding:14px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
.callouts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.callouts span{background:var(--violet);color:#111;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:14px/1 var(--body);background:var(--blue);color:#111;border-radius:8px;padding:6px 8px;animation:pop .4s both;animation-delay:calc(var(--i,0)*18ms)}
.chip sup{font-size:9px;opacity:.7;margin-left:2px}
.chip.ok{background:var(--lime)}
/* chunks */
.chunk{border-radius:12px;padding:10px 12px;margin:0 0 10px;color:#111;position:relative;animation:pop .45s both;animation-delay:calc(var(--i,0)*120ms)}
.chunk .tag2{position:absolute;top:-9px;left:10px;background:#111;color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px}
.chunk.top{outline:3px solid #fff;outline-offset:2px}
.chunks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
/* vectors */
.vec{display:flex;align-items:flex-end;gap:6px;height:130px;padding:10px 4px 0;border-bottom:2px solid #444}
.vec .bar{flex:1;background:var(--pink);border-radius:6px 6px 0 0;min-width:18px;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,1,.3,1) both;animation-delay:calc(var(--i,0)*90ms);position:relative}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.vec .bar span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text);white-space:nowrap}
.vec-labels{display:flex;gap:6px;margin-top:4px}
.vec-labels span{flex:1;text-align:center;font-size:11px;color:var(--dim);min-width:18px}
/* map */
.map{position:relative;width:100%;flex:1;min-height:340px;background:#15151c;border-radius:14px;border:2px dashed #3a3a48}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);transition:left .9s cubic-bezier(.2,1,.3,1),top .9s;cursor:pointer}
.dot-label{position:absolute;transform:translate(10px,-50%);font:600 13px var(--body);white-space:nowrap;pointer-events:none}
.axis{position:absolute;font:600 12px var(--body);color:var(--dim)}
.sline{position:absolute;height:3px;background:var(--orange);transform-origin:0 50%;transition:opacity .5s;opacity:0}
/* score bars */
.score{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.score .track{height:18px;background:#2b2b35;border-radius:9px;overflow:hidden}
.score .fill{height:100%;background:var(--violet);border-radius:9px;width:0;transition:width .9s cubic-bezier(.2,1,.3,1)}
.score.top .fill{background:var(--lime)}
.score.top{font-weight:700}
.formula{font:18px var(--hand);color:var(--blue);background:#15151c;border-radius:12px;padding:10px 14px;margin-top:10px}
/* prompt parts */
.parts{display:grid;gap:10px}
.part{border-radius:12px;padding:12px 14px;color:#111;animation:slide .6s both;animation-delay:calc(var(--i,0)*260ms)}
.part h5{margin:0 0 4px;font:700 13px var(--body);text-transform:uppercase;letter-spacing:.06em}
.part p{margin:0;font-size:14.5px}
.p1{background:var(--blue)}.p2{background:var(--lime)}.p3{background:var(--pink)}
/* llm */
.llm{width:200px;height:150px;border-radius:26px;background:var(--violet);color:#111;display:flex;align-items:center;justify-content:center;font:28px var(--display);box-shadow:0 0 0 0 rgba(165,132,245,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(165,132,245,.6)}70%{box-shadow:0 0 0 22px rgba(165,132,245,0)}100%{box-shadow:0 0 0 0 rgba(165,132,245,0)}}
.packet{position:absolute;padding:6px 10px;border-radius:8px;font:600 13px var(--body);color:#111;transition:transform 1s cubic-bezier(.3,.9,.3,1),opacity .6s}
.answer{font-size:18px;line-height:1.6;background:var(--paper);color:var(--ink);border-radius:14px;padding:16px 18px;min-height:90px}
.cite{display:inline-block;background:var(--lime);color:#111;border-radius:6px;padding:0 6px;font-size:13px;font-weight:700;margin-left:4px}
/* flow lane */
.lane{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lane .node{padding:10px 12px;border-radius:12px;background:#2a2a36;color:var(--text);font-size:14px;font-weight:600;transition:transform .4s,background .4s;transform:scale(.95)}
.lane .node.lit{background:var(--orange);color:#111;transform:scale(1.06)}
.lane .arr{color:var(--dim);font-size:18px}
/* notebook */
.notebook{display:flex;flex-direction:column;min-height:0;padding:16px;gap:12px;border-left:2px solid var(--line);background:linear-gradient(180deg,#1c1c24,#17171e)}
.nb-page{flex:1;min-height:0;overflow:auto;background:var(--panel);color:var(--text);border-radius:14px;padding:18px 18px;border:2px solid var(--line);font:15px/1.55 var(--body)}
.nb-page h3{font:26px/1.1 var(--display);margin:0 0 8px;color:var(--blue)}
.nb-page ul{margin:0;padding-left:20px}
.nb-page li{font:15px/1.5 var(--body);margin-bottom:6px;color:var(--text)}
.nb-page li::marker{color:var(--orange)}
.nb-page .term{font:15px/1.5 var(--body);margin-top:12px;padding:10px 12px;border-radius:10px;background:#25252f;color:var(--text)}
.nb-page .term b{color:var(--pink)}
.nb-page .sec{font:20px var(--display);color:var(--orange);margin-top:18px;letter-spacing:.3px}
.nb-page .gloss{font-size:14px;margin:8px 0;padding:8px 10px;border-radius:10px;background:#25252f;border-left:3px solid var(--violet)}
.nb-page .gloss b{color:var(--pink)}
.nb-page .check{margin-top:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--dim)}
.nb-page .check .btn{align-self:flex-start;margin-right:8px}
.nb-page .msg{font-size:14px;color:var(--lime);min-height:1.3em}
/* bottom bar */
footer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:2px solid var(--line);flex-wrap:wrap}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.steps button{font:600 12px var(--body);background:#25252f;color:var(--dim);border:1px solid #33333f;border-radius:999px;padding:6px 10px;cursor:pointer}
.steps button.on{background:var(--orange);color:#111;border-color:var(--orange)}
.steps button.done{color:var(--lime)}
.ctrl{display:flex;gap:8px}
.hint{font-size:12px;color:var(--dim)}
kbd{font:12px ui-monospace,Consolas,monospace;background:#222;border:1px solid #333;border-radius:4px;padding:0 5px}
.pause-box{background:var(--hot);color:#111;border-radius:12px;padding:12px 14px;margin-top:10px;font-weight:600}
.pause-box .ans{display:none;margin-top:8px;font-weight:500;background:#fff;border-radius:8px;padding:8px 10px}
.pause-box .ans.on{display:block}
@media (max-width:1000px){
  .app{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr}
  .teacher{border-right:0;border-bottom:2px solid var(--line);flex-direction:row;align-items:flex-end;gap:12px}
  .teacher .figure{width:150px;flex:none;margin:0}
  .speech{margin:0;flex:1}
  .speech:after{display:none}
  .board{min-height:520px}
  .notebook{border-left:0;border-top:2px solid var(--line)}
  .nb-page{max-height:360px}
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important} .teacher .figure{animation:none} }

/* ---- beats: one beat per screen; the blocks of a beat sit on the board ---- */
.beat{display:none}
.beat.on{display:block;animation:fade .4s ease both}
.stage{padding:18px 18px 22px}
.beat .vb{margin:10px 0}
/* ---- block library (vb-*) ---- */
/* Virus block library. Every class is prefixed vb- so blocks never clash with the host page. */
.vb{font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4f4f1;background:#1f1f26;border:2px solid #2d2d38;border-radius:14px;padding:14px 16px;margin:16px 0;max-width:100%}
.vb-title{font-weight:700;margin:0 0 8px;color:#9ED4E2}
.vb-note{color:#a3a3ad;font-size:14px;margin:6px 0}
.vb-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.vb-btn{font:600 14px inherit;color:#141414;background:#9ED4E2;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.vb-btn.alt{background:#2c2c38;color:#f4f4f1}
.vb-btn[disabled]{opacity:.45;cursor:not-allowed}
.vb-btn:focus-visible,.vb-card:focus-visible,.vb input:focus-visible,.vb textarea:focus-visible{outline:3px solid #FFB1D7;outline-offset:2px}
.vb-say{background:#fff;color:#1d1d1d;border-radius:12px;padding:10px 12px;margin:8px 0}
.vb-say b{color:#7D3DDC}
.vb-takeaway{background:#FF5A99;color:#141414;border-radius:10px;padding:8px 12px;font-weight:600;margin-top:10px}
.vb-hidden{display:none!important}
.vb-fade{animation:vb-fade .5s ease both}
@keyframes vb-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vb-svg{width:100%;height:auto;background:#27332d;border-radius:10px}
.vb-svg .vb-n{transition:opacity .5s}
.vb-svg .vb-n.off{opacity:0}
.vb-svg .vb-ring{fill:none;stroke:#FF5A99;stroke-width:3;transition:opacity .4s}
.vb-svg .vb-ring.off{opacity:0}
.vb-svg text{font-family:system-ui,sans-serif;font-size:15px;fill:#f4f4f1}
.vb-list{display:grid;gap:8px;margin:8px 0;padding:0;list-style:none}
.vb-li{border:1px solid #33333f;border-radius:10px;padding:8px 10px;background:#25252f}
.vb-li.right{border-color:#B5CF1C}
.vb-li.wrong{border-color:#FF5A99}
.vb-dim{color:#a3a3ad}
.vb-code{font:13px/1.55 ui-monospace,Consolas,monospace;background:#0b0b0f;color:#e8ffe0;border-radius:10px;padding:10px 12px;white-space:pre;overflow:auto;margin:8px 0}
.vb-code .hl{background:#2d4a3a;display:block;border-radius:4px}
.vb-def{border-left:3px solid #FF5A99;padding:4px 0 4px 12px;margin:8px 0}
.vb-def u{text-decoration-color:#FF5A99;text-decoration-thickness:2px}
.vb-flip{perspective:800px}
.vb-card{background:#25252f;border:1px solid #33333f;border-radius:12px;padding:14px;min-height:110px;cursor:pointer}
.vb-card .vb-face{font-size:16px}
.vb-card .vb-back{display:none;color:#f4f4f1}
.vb-card.flipped .vb-front{display:none}
.vb-card.flipped .vb-back{display:block}
.vb-ta{width:100%;min-height:90px;font:inherit;color:#f4f4f1;background:#15151c;border:1px solid #33333f;border-radius:10px;padding:8px}
.vb-range{width:100%}
@media (prefers-reduced-motion: reduce){ .vb *{animation:none!important;transition:none!important} }

  <footer>
    <div class="steps" id="steps"></div>
    <div class="ctrl">
      <button class="btn alt" id="prev" type="button">◀ Pichla</button>
      <button class="btn" id="next" type="button">Agla ▶</button>
      <button class="btn alt" id="replay" type="button">↺</button>
    </div>
    <span class="hint"><kbd>←</kbd> <kbd>→</kbd></span>
  </footer>

<script>
/* Virus block library runtime. No dependencies, no CDN, works from file://.
   Usage: a div with class "vb" and data-block="pause-socho", holding a JSON script tag with the props.
   Inlined into a page, this file must not contain the closing script tag text, or the page breaks.
   Mounts on DOMContentLoaded. Call VirusBlocks.mount(root) for blocks added later. */
(function () {
  'use strict';

  function h(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) {
      if (c == null || c === false) return;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return n;
  }
  function btn(label, onClick, alt) {
    var b = h('button', {type: 'button', class: 'vb-btn' + (alt ? ' alt' : '')}, [label]);
    b.addEventListener('click', onClick);
    return b;
  }
  function title(t) { return t ? h('p', {class: 'vb-title'}, [t]) : null; }
  function takeaway(t) { return t ? h('div', {class: 'vb-takeaway'}, ['Yaad rakho: ' + t]) : null; }

  // Clipboard: navigator.clipboard, then execCommand, then select-and-show.
  function copyText(text, area, msg) {
    function fallback() {
      try {
        area.classList.remove('vb-hidden');
        area.focus(); area.select();
        var ok = document.execCommand && document.execCommand('copy');
        msg.textContent = ok ? 'Copy ho gaya.' : 'Select karke Ctrl+C dabao.';
      } catch (e) { msg.textContent = 'Select karke Ctrl+C dabao.'; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { msg.textContent = 'Copy ho gaya.'; }, fallback);
    } else { fallback(); }
  }

  var SVGNS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }
  var ROLE = {input: '#8ec5ff', component: '#9be59b', source: '#f5d76e'};

  // Diagram: nodes [{id,x,y,w,h,label,role}], arrows [{id,from,to}]. Every drawn part carries data-id.
  function drawGraph(nodes, arrows, vb) {
    var svg = svgEl('svg', {viewBox: vb || '0 0 960 300', class: 'vb-svg', role: 'img'});
    var byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });
    arrows.forEach(function (a) {
      var f = byId[a.from], t = byId[a.to];
      if (!f || !t) return;
      // Straight line by default. An arrow may give its own route as points [[x,y],...] to avoid boxes.
      var seg;
      if (a.points && a.points.length > 1) {
        seg = svgEl('polyline', {points: a.points.map(function (q) { return q.join(','); }).join(' '), fill: 'none', stroke: '#e9e9e2', 'stroke-width': 2});
      } else {
        seg = svgEl('line', {x1: f.x + f.w, y1: f.y + f.h / 2, x2: t.x, y2: t.y + t.h / 2, stroke: '#e9e9e2', 'stroke-width': 2});
      }
      seg.setAttribute('class', 'vb-n');
      seg.setAttribute('data-id', a.id);
      svg.appendChild(seg);
    });
    nodes.forEach(function (n) {
      var r = svgEl('rect', {x: n.x, y: n.y, width: n.w, height: n.h, rx: 10, fill: 'none', stroke: ROLE[n.role] || '#9be59b', 'stroke-width': 2.2});
      r.setAttribute('class', 'vb-n'); r.setAttribute('data-id', n.id);
      svg.appendChild(r);
      var t = svgEl('text', {x: n.x + n.w / 2, y: n.y + n.h / 2, 'text-anchor': 'middle', 'dominant-baseline': 'middle'});
      t.textContent = n.label;
      t.setAttribute('class', 'vb-n'); t.setAttribute('data-id', n.id);
      svg.appendChild(t);
      var ring = svgEl('rect', {x: n.x - 6, y: n.y - 6, width: n.w + 12, height: n.h + 12, rx: 14});
      ring.setAttribute('class', 'vb-ring off'); ring.setAttribute('data-ring', n.id);
      svg.appendChild(ring);
    });
    return svg;
  }
  function setIds(svg, ids, on) {
    svg.querySelectorAll('.vb-n[data-id]').forEach(function (e) {
      if (ids.indexOf(e.getAttribute('data-id')) > -1) e.classList.toggle('off', !on);
    });
  }
  function hideAll(svg) { svg.querySelectorAll('.vb-n').forEach(function (e) { e.classList.add('off'); }); }
  function ringOn(svg, id) {
    svg.querySelectorAll('[data-ring]').forEach(function (r) { r.classList.add('off'); });
    if (id) { var r = svg.querySelector('[data-ring="' + id + '"]'); if (r) r.classList.remove('off'); }
  }

  var BLOCKS = {};

  // whiteboard: animated scene. Props: nodes, arrows, steps [{caption, show[], ring}], title, takeaway.
  BLOCKS['whiteboard'] = function (root, p) {
    var svg = drawGraph(p.nodes, p.arrows || [], p.viewBox);
    var cap = h('p', {class: 'vb-say', 'aria-live': 'polite'});
    var counter = h('span', {class: 'vb-dim'});
    var pos = -1;
    // Gap: a dashed red line with a "?" between two boxes. Shown only during its own step.
    var byNode = {};
    p.nodes.forEach(function (n) { byNode[n.id] = n; });
    function gapLine(pair) {
      var a = byNode[pair[0]], b = byNode[pair[1]];
      if (!a || !b) return null;
      var horiz = Math.abs((a.y + a.h / 2) - (b.y + b.h / 2)) < 20;
      var x1 = horiz ? a.x + a.w + 4 : a.x + a.w / 2, y1 = a.y + a.h / 2;
      var x2 = horiz ? b.x - 4 : b.x + b.w / 2, y2 = b.y + b.h / 2;
      var g = svgEl('g', {class: 'vb-gap'});
      var l = svgEl('line', {x1: x1, y1: y1, x2: x2, y2: y2, stroke: '#ff8a80', 'stroke-width': 2.4, 'stroke-dasharray': '8 8'});
      var q = svgEl('text', {x: (x1 + x2) / 2 - 6, y: y1 - 12, fill: '#ff8a80', 'font-size': 22, 'font-weight': 700});
      q.textContent = '?';
      g.appendChild(l); g.appendChild(q);
      svg.appendChild(g);
      return g;
    }
    var gapGroups = [];
    p.steps.forEach(function (st, k) { gapGroups[k] = st.gap ? gapLine(st.gap) : null; });
    function apply(i) {
      pos = Math.max(-1, Math.min(p.steps.length - 1, i));
      hideAll(svg);
      for (var k = 0; k <= pos; k++) setIds(svg, p.steps[k].show || [], true);
      var cur = p.steps[pos];
      ringOn(svg, cur && cur.ring);
      gapGroups.forEach(function (g, k) { if (g) g.style.display = (k === pos) ? '' : 'none'; });
      cap.textContent = cur ? cur.caption : (p.intro || 'Shuru karte hain.');
      counter.textContent = (pos + 1) + ' / ' + p.steps.length;
    }
    // Keyboard: when focus is inside the board, the arrow keys step through it.
    root.setAttribute('tabindex', '0');
    root.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); apply(pos + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); apply(pos - 1); }
    });
    var penOn = true;
    var pen = btn('✎ Pen', function () {
      penOn = !penOn;
      svg.querySelectorAll('[data-ring]').forEach(function (r) { r.style.display = penOn ? '' : 'none'; });
    }, true);
    var prev = btn('◀', function () { apply(pos - 1); }, true);
    var next = btn('▶', function () { apply(pos + 1); });
    var again = btn('↺', function () { apply(0); }, true);
    root.append(title(p.title), svg, cap, h('div', {class: 'vb-row'}, [prev, next, pen, again, counter]), takeaway(p.takeaway));
    apply(0);
  };

  // recap-board: shows the previous board in full, then rings today's node on click.
  BLOCKS['recap-board'] = function (root, p) {
    var svg = drawGraph(p.nodes, p.arrows || [], p.viewBox);
    svg.querySelectorAll('.vb-n').forEach(function (e) { e.classList.remove('off'); });
    var go = btn('Aaj ka node dikhao', function () { ringOn(svg, p.today); });
    root.append(title(p.title), h('p', {class: 'vb-note'}, [p.previousLabel || 'Pichli baar ka board.']), svg,
      h('div', {class: 'vb-row'}, [go]), p.say ? h('p', {class: 'vb-say'}, [p.say]) : null);
  };

  // compare-pair: the same list twice. The changed item only lights up on "Dono dekho".
  BLOCKS['compare-pair'] = function (root, p) {
    function col(label, items, mark) {
      return h('div', {class: 'vb-card', style: 'flex:1 1 200px;cursor:default'}, [
        h('div', {class: 'vb-title'}, [label]),
        h('ul', {class: 'vb-list'}, items.map(function (t, i) {
          return h('li', {class: 'vb-li' + (mark && i === p.changed ? ' ' + mark : '')}, [t]);
        }))
      ]);
    }
    var left = col(p.left.label, p.left.items, '');
    var right = col(p.right.label, p.right.items, '');
    var grid = h('div', {class: 'vb-row', style: 'align-items:stretch'}, [left, right]);
    var toggle = btn('Dono dekho', function () {
      var li = right.querySelectorAll('li')[p.changed];
      if (li) li.classList.add('right');
      this.disabled = true;
    });
    root.append(title(p.title), grid, h('div', {class: 'vb-row'}, [toggle]),
      p.why ? h('p', {class: 'vb-note'}, [p.why]) : null, takeaway(p.takeaway));
  };

  // ladder: spine with branches, revealed one by one.
  BLOCKS['ladder'] = function (root, p) {
    var list = h('ul', {class: 'vb-list'});
    var items = p.branches.map(function (t) { return h('li', {class: 'vb-li vb-hidden'}, ['├─ ' + t]); });
    items.forEach(function (li) { list.append(li); });
    var shown = 0;
    var next = btn('Agla branch', function () {
      if (shown < items.length) items[shown++].classList.remove('vb-hidden');
      if (shown >= items.length) this.disabled = true;
    });
    root.append(title(p.title), list, h('div', {class: 'vb-row'}, [next]), takeaway(p.takeaway));
  };

  // definition: anchor line with a red bar, keywords underlined.
  BLOCKS['definition'] = function (root, p) {
    var body = h('p', {});
    var text = p.text || '';
    var keys = (p.keywords || []).filter(Boolean);
    var i = 0;
    while (i < text.length) {
      var hit = null;
      for (var k = 0; k < keys.length; k++) {
        if (text.substr(i, keys[k].length) === keys[k] && (!hit || keys[k].length > hit.length)) hit = keys[k];
      }
      if (hit) { body.append(h('u', {}, [hit])); i += hit.length; }
      else { body.append(text.charAt(i)); i++; }
    }
    root.append(title(p.title), h('div', {class: 'vb-def'}, [body]), p.why ? h('p', {class: 'vb-note'}, [p.why]) : null);
  };

  // worked-example: one example with real numbers, revealed step by step.
  BLOCKS['worked-example'] = function (root, p) {
    var list = h('ol', {class: 'vb-list'});
    var items = p.steps.map(function (s) {
      return h('li', {class: 'vb-li vb-hidden'}, [s.text + (s.value != null ? ' → ' + s.value : '')]);
    });
    items.forEach(function (li) { list.append(li); });
    var shown = 0;
    var next = btn('Agla step', function () {
      if (shown < items.length) items[shown++].classList.remove('vb-hidden');
      if (shown >= items.length) this.disabled = true;
    });
    root.append(title(p.title), h('p', {class: 'vb-note'}, ['Setup: ' + p.setup]), list, h('div', {class: 'vb-row'}, [next]), takeaway(p.takeaway));
  };

  // pause-socho: the learner picks first. Then "The answer is…" plus the why.
  BLOCKS['pause-socho'] = function (root, p) {
    var picked = false;
    var list = h('ul', {class: 'vb-list'});
    var reveal = h('div', {class: 'vb-say vb-hidden'});
    var items = [];
    function pick(i) {
      if (picked) return;
      picked = true;
      var o = p.options[i];
      items.forEach(function (x, j) {
        if (p.options[j].correct) x.classList.add('right');
        else if (j === i) x.classList.add('wrong');
      });
      reveal.classList.remove('vb-hidden');
      reveal.textContent = (o.correct ? 'Sahi. ' : 'Ruko, ye galat hai. ') + (o.why || '');
      reveal.append(h('p', {}, [h('b', {}, ['The answer is… ']), p.answer]));
    }
    p.options.forEach(function (o, i) {
      var li = h('li', {class: 'vb-li', role: 'button', tabindex: '0'}, [o.text]);
      li.addEventListener('click', function () { pick(i); });
      li.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(i); }
      });
      items.push(li);
      list.append(li);
    });
    root.append(title(p.title), h('p', {class: 'vb-say'}, [h('b', {}, ['Ek baar ruk ke socho: ']), p.question]), list, reveal, takeaway(p.takeaway));
  };

  // output-kya-aayega: code stepper. Predict first, then reveal. Errors are narrated and fixed.
  BLOCKS['output-kya-aayega'] = function (root, p) {
    var i = 0;
    var codeBox = h('pre', {class: 'vb-code'});
    var predict = h('input', {type: 'text', placeholder: 'Tumhara andaza', 'aria-label': 'Predict the output'});
    var out = h('div', {class: 'vb-say vb-hidden'});
    function draw() {
      codeBox.textContent = '';
      p.code.forEach(function (line, n) {
        codeBox.append(h('span', {class: n === i ? 'hl' : ''}, [line + '\n']));
      });
      out.classList.add('vb-hidden');
      predict.value = '';
    }
    function reveal() {
      var s = p.steps[i] || {};
      out.classList.remove('vb-hidden');
      out.textContent = s.error
        ? 'Error aa raha hai, dekho kyun: ' + s.error + '\nFix: ' + s.fix
        : 'output: ' + (s.output != null ? s.output : '');
    }
    var prev = btn('◀', function () { i = Math.max(0, i - 1); draw(); }, true);
    var nxt = btn('▶', function () { i = Math.min(p.code.length - 1, i + 1); draw(); });
    var rv = btn('Output dikhao', reveal, true);
    draw();
    root.append(title(p.title), codeBox,
      h('p', {class: 'vb-say'}, [h('b', {}, ['output kya aayega? ']), 'Pehle andaza lagao.']),
      predict, h('div', {class: 'vb-row'}, [prev, nxt, rv]), out, takeaway(p.takeaway));
  };

  // yahan-tak-clear: ✓ clear, or ✗ opens a different analogy and a link back.
  BLOCKS['yahan-tak-clear'] = function (root, p) {
    var msg = h('div', {class: 'vb-say vb-hidden', 'aria-live': 'polite'});
    var yes = btn('✓ Clear hai', function () {
      msg.classList.remove('vb-hidden');
      msg.textContent = 'Theek hai. Agla part.';
    });
    var no = btn('✗ Clear nahi', function () {
      msg.classList.remove('vb-hidden');
      msg.textContent = p.explainAgain || 'Koi baat nahi. Is section ko ek baar aur dekho.';
      if (p.revisit && !msg.querySelector('a')) {
        msg.append(h('br'), h('a', {href: p.revisit}, ['Is section pe wapas jao']));
      }
    }, true);
    root.append(title(p.title || 'Yahan tak clear hai?'), h('div', {class: 'vb-row'}, [yes, no]), msg);
  };

  // khud-ko-samjhao: explain back in 3–4 lines, then copy to Virus for grading in chat.
  BLOCKS['khud-ko-samjhao'] = function (root, p) {
    var ta = h('textarea', {class: 'vb-ta', 'aria-label': 'Apne shabdon mein likho'});
    var msg = h('p', {class: 'vb-note', 'aria-live': 'polite'});
    var copy = btn('Virus ko copy karo', function () {
      copyText('Maine ye samjha:\n' + ta.value + '\n\nMujhe feedback do.', ta, msg);
    });
    root.append(title(p.title), h('p', {class: 'vb-say'}, [h('b', {}, ['khud ko samjhao: ']), p.prompt]),
      ta, h('div', {class: 'vb-row'}, [copy]), msg);
  };

  // hint-ladder: hint 1, then hint 2, then the solution unlocks last.
  BLOCKS['hint-ladder'] = function (root, p) {
    var shown = 0;
    var box = h('div', {class: 'vb-list'});
    var sol = btn('Solution dekho', function () {
      box.append(h('div', {class: 'vb-li vb-fade'}, ['Solution: ' + p.solution]));
      this.disabled = true;
    }, true);
    sol.disabled = true;
    var hintBtn = btn('Hint lo', function () {
      if (shown < p.hints.length) {
        box.append(h('div', {class: 'vb-li vb-fade'}, ['Hint ' + (shown + 1) + ': ' + p.hints[shown]]));
        shown++;
      }
      if (shown >= p.hints.length) { this.disabled = true; sol.disabled = false; }
    });
    root.append(title(p.title), h('p', {class: 'vb-say'}, [p.task]),
      h('p', {class: 'vb-note'}, ['Poora solution mat dekho, pehle hint lo.']),
      h('div', {class: 'vb-row'}, [hintBtn, sol]), box);
  };

  // revision-cards: flip on click or Enter. Fronts are learner-voice questions.
  BLOCKS['revision-cards'] = function (root, p) {
    var grid = h('div', {class: 'vb-row', style: 'align-items:stretch'});
    p.cards.forEach(function (c) {
      var card = h('div', {class: 'vb-card vb-flip', tabindex: '0', role: 'button', 'aria-label': 'Flip card', style: 'flex:1 1 220px'}, [
        h('div', {class: 'vb-face vb-front'}, [c.front]),
        h('div', {class: 'vb-face vb-back'}, [c.back, c.example ? h('p', {class: 'vb-note'}, ['Example: ' + c.example]) : null])
      ]);
      function flip() { card.classList.toggle('flipped'); }
      card.addEventListener('click', flip);
      card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
      });
      grid.append(card);
    });
    root.append(title(p.title || 'Quick revision'), grid);
  };

  // sandbox: a slider changes the board live. rows [{upto, text}]: first row where value <= upto wins.
  BLOCKS['sandbox'] = function (root, p) {
    var range = h('input', {type: 'range', class: 'vb-range', min: p.min, max: p.max, value: p.value, 'aria-label': p.label});
    var out = h('p', {class: 'vb-say', 'aria-live': 'polite'});
    function update() {
      var v = +range.value;
      var text = p.rows[p.rows.length - 1].text;
      for (var i = 0; i < p.rows.length; i++) {
        if (v <= p.rows[i].upto) { text = p.rows[i].text; break; }
      }
      out.textContent = p.label + ': ' + v + ' → ' + text;
    }
    range.addEventListener('input', update);
    update();
    root.append(title(p.title), range, out, p.try ? h('p', {class: 'vb-note'}, [p.try]) : null, takeaway(p.takeaway));
  };

  // padh-ke-dekho: dense prompt or code, expandable.
  BLOCKS['padh-ke-dekho'] = function (root, p) {
    var d = h('details', {class: 'vb-card', style: 'cursor:default'}, [
      h('summary', {}, [p.summary || 'Video pause karke padhna zaroor']),
      h('pre', {class: 'vb-code'}, [p.body])
    ]);
    root.append(title(p.title), d);
  };

  // kis-side-mein: classify each term. Wrong picks say why.
  BLOCKS['kis-side-mein'] = function (root, p) {
    var list = h('ul', {class: 'vb-list'});
    var msg = h('p', {class: 'vb-note', 'aria-live': 'polite'});
    p.items.forEach(function (it) {
      var li = h('li', {class: 'vb-li'}, [h('div', {}, [it.term])]);
      var row = h('div', {class: 'vb-row'});
      p.sides.forEach(function (side) {
        var b = btn(side, function () {
          var right = side === it.side;
          li.classList.add(right ? 'right' : 'wrong');
          msg.textContent = (right ? 'Sahi. ' : 'Galat side. ') + (it.why || '');
          row.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
        }, true);
        row.append(b);
      });
      li.append(row);
      list.append(li);
    });
    root.append(title(p.title || 'Kis side mein aayega?'), list, msg);
  };

  // homework: one extend-what-we-built task. Hint on request.
  BLOCKS['homework'] = function (root, p) {
    var hint = h('p', {class: 'vb-note vb-hidden'}, [p.hint || '']);
    var hb = btn('Hint', function () { hint.classList.remove('vb-hidden'); }, true);
    root.append(title(p.title || 'Ek chhota sa homework'), h('p', {class: 'vb-say'}, [p.task]),
      h('div', {class: 'vb-row'}, [hb]), hint);
  };

  // ask-virus: copy a ready follow-up prompt for Claude Code.
  BLOCKS['ask-virus'] = function (root, p) {
    var msg = h('p', {class: 'vb-note', 'aria-live': 'polite'});
    var area = h('textarea', {class: 'vb-ta vb-hidden', readonly: 'readonly', 'aria-label': 'Prompt'});
    area.value = p.prompt;
    var b = btn(p.label || 'Prompt copy karo', function () { copyText(p.prompt, area, msg); });
    root.append(title(p.title), h('div', {class: 'vb-row'}, [b]), msg, area);
  };

  function mountOne(el) {
    if (el.getAttribute('data-mounted') === '1') return;
    var name = el.getAttribute('data-block');
    var fn = BLOCKS[name];
    if (!fn) { el.append(h('p', {class: 'vb-note'}, ['Block "' + name + '" abhi nahi hai.'])); return; }
    var script = el.querySelector('script[type="application/json"]');
    var props;
    try { props = script ? JSON.parse(script.textContent) : {}; }
    catch (e) { el.append(h('p', {class: 'vb-note'}, ['Block ka data theek nahi hai.'])); return; }
    el.classList.add('vb');
    if (script) script.remove();
    try { fn(el, props); el.setAttribute('data-mounted', '1'); }
    catch (e) { el.append(h('p', {class: 'vb-note'}, ['Block load nahi hua.'])); }
  }
  function mount(root) {
    (root || document).querySelectorAll('[data-block]').forEach(mountOne);
  }
  window.VirusBlocks = {mount: mount, names: Object.keys(BLOCKS)};
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { mount(); });
  else mount();
})();

</script>
<script>
(function () {
  'use strict';
  var beats = Array.prototype.slice.call(document.querySelectorAll('.beat'));
  var idx = 0, typer = null;
  var speech = document.getElementById('speech');
  var notes = document.getElementById('notes');
  var steps = document.getElementById('steps');
  var take = document.getElementById('take');
  var crumb = document.getElementById('crumb');

  function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

  // One teacher line at a time, typed out. Shown in full when reduced motion is on.
  function typeSpeech(text) {
    if (typer) { clearInterval(typer); typer = null; }
    speech.textContent = '';
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { speech.textContent = text; return; }
    var i = 0;
    typer = setInterval(function () {
      i++; speech.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(typer); typer = null; }
    }, 14);
  }

  function renderNotes(i) {
    var b = beats[i];
    var html = '<h3>' + esc(b.getAttribute('data-title') || '') + '</h3><ul>';
    (b.getAttribute('data-notes') || '').split('|').filter(Boolean).forEach(function (n) {
      html += '<li>' + esc(n) + '</li>';
    });
    html += '</ul>';
    var terms = [];
    for (var k = 0; k <= i; k++) {
      var t = beats[k].getAttribute('data-term');
      if (t) terms.push(t);
    }
    if (terms.length) {
      html += '<div class="sec">Ab tak ke shabd</div>';
      terms.forEach(function (t) {
        var parts = t.split('|');
        html += '<div class="gloss"><b>' + esc(parts[0]) + ':</b> ' + esc(parts.slice(1).join('|')) + '</div>';
      });
    }
    notes.innerHTML = html;
  }

  function show(i) {
    if (beats.length === 0) return;
    idx = Math.max(0, Math.min(beats.length - 1, i));
    beats.forEach(function (b, k) { b.classList.toggle('on', k === idx); });
    var b = beats[idx];
    typeSpeech(b.getAttribute('data-speech') || '');
    var tk = b.getAttribute('data-takeaway');
    take.innerHTML = tk ? '<b>YAAD RAKHO</b><span>' + esc(tk) + '</span>' : '';
    take.style.display = tk ? '' : 'none';
    renderNotes(idx);
    crumb.textContent = 'Beat ' + (idx + 1) + ' / ' + beats.length + ' · ' + (b.getAttribute('data-title') || '');
    Array.prototype.forEach.call(steps.children, function (btn, k) {
      btn.classList.toggle('on', k === idx);
      btn.classList.toggle('done', k < idx);
    });
    document.getElementById('stage').scrollTop = 0;
  }

  beats.forEach(function (b, k) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = (k + 1) + ' ' + (b.getAttribute('data-title') || '');
    btn.addEventListener('click', function () { show(k); });
    steps.appendChild(btn);
  });
  document.getElementById('next').addEventListener('click', function () { show(idx + 1); });
  document.getElementById('prev').addEventListener('click', function () { show(idx - 1); });
  document.getElementById('replay').addEventListener('click', function () { show(0); });
  document.addEventListener('keydown', function (ev) {
    var t = ev.target || {};
    if (/INPUT|TEXTAREA|BUTTON|SELECT/.test(t.tagName || '')) return;
    if (t.closest && t.closest('.vb')) return;   // a block (e.g. the whiteboard) handles its own arrows
    if (ev.key === 'ArrowRight') show(idx + 1);
    if (ev.key === 'ArrowLeft') show(idx - 1);
  });
  show(0);
})();
</script>
</body>
</html>
